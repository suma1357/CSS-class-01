<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palatte</title>
    <style>
        body {
            background-color: rgb(220, 225, 226);
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            color: rgb(10, 6, 6);}
            .box {
                width: 100px;
                height: 100px;
                display: inline-block;
                background-color: rgb(238, 238, 245);
                line-height: 100px;
                margin: 8px;}
                #red {
                    background-color: rgb(233, 12, 12);
                     border: 5px solid black;
                }
                #green {
                    background-color: rgb(12, 233, 12);
                    border: 5px solid black;
                }
                #blue {
                    background-color: rgb(12, 12, 233);
                    border: 5px solid black;
                }
                
                #yellow {
                    background-color: rgb(233, 233, 12);
                    border: 5px solid black;
                }
    </style>
</head>
<body>
    <h1>Color Palette</h1>
    <div class="box" id="red"></div>
    <div class="box" id="green"></div>
    <div class="box" id="blue"></div>
    <div class="box" id="yellow"></div>
</body>
</html>
