<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Playground</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .box {
            width: 100px;
            padding: 20px;
            height: 100px;
            background-color: navy;
            margin: 20px auto;
        }
        .a {
            width: 100px;
            padding: 20px;
            height: 100px;
            border: 5px solid black;
            background-color: rgba(241, 44, 44, 0.801);
            margin: 20px auto;
        }
        .b {
            width: 100px;
            padding: 20px;
            height: 100px;
            border-radius: 12px;
            background-color: rgba(44, 241, 61, 0.801);
            margin: 20px auto;
        }
        .c {
            width: 100px;
            padding: 20px;
            height: 100px;
            box-shadow: 10px 10px 5px grey;
            background-color: rgba(38, 38, 240, 0.822);
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
</body>
</html>
